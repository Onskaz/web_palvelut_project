version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: elainsuoja-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shelter
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shelter"]
      interval: 5s
      timeout: 5s
      retries: 5

  server-b:
    build: ./server-b
    container_name: elainsuoja-server-b
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:password@db:5432/shelter
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  server-a:
    build: ./server-a
    container_name: elainsuoja-server-a
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:password@db:5432/shelter
      SERVER_B_URL: http://server-b:4000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      server-b:
        condition: service_started